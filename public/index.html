<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VM Manager" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231f2937' width='192' height='192'/><text x='50%' y='50%' font-size='80' fill='white' text-anchor='middle' dominant-baseline='central'>🖥</text></svg>" />
    <meta
      name="description"
      content="Chrome OS VM Manager - Windows 10 Virtual Machine Control"
    />
    <title>Chrome OS VM Manager</title>
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/bundle.js"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('✅ Service Worker registered successfully');
              console.log('Scope:', registration.scope);
            })
            .catch((error) => {
              console.log('⚠️  Service Worker registration failed:', error);
            });
        });

        // Handle service worker updates
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('🔄 Service Worker updated');
          window.location.reload();
        });
      } else {
        console.log('⚠️  Service Workers not supported in this browser');
      }

      // Install prompt handling
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('✅ App can be installed');
        
        // Show install button to user
        const installBtn = document.getElementById('install-button');
        if (installBtn) {
          installBtn.style.display = 'block';
          installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              console.log(`User response to the install prompt: ${outcome}`);
              deferredPrompt = null;
            }
          });
        }
      });

      window.addEventListener('appinstalled', () => {
        console.log('✅ App installed successfully');
        deferredPrompt = null;
      });

      // Detect if running as PWA
      if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('✅ Running as PWA (standalone mode)');
      }
    </script>
  </body>
</html>
